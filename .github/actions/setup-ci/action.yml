name: Setup CI
description: Install the locked workspace and generate runtime imports.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Generate Prisma client
      shell: bash
      run: pnpm db:generate
    - name: Compile interface messages
      shell: bash
      run: pnpm --filter @nibleaf/i18n run setup
