name: Protect v0.2.0 release with guide rehearsal
on:
  push:
    branches: [rehearsal/upgrade-v0-2]
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [recovery-quiet]
    env:
      GUIDE_COMMIT: 8e9281995beef4b8089af2b884bc5882035a3788
      CANDIDATE: sha-a28cbfdbec01f478caa4374eb36ad834e5424fb6
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y expect >/dev/null
      - name: Execute extracted commands with disposable fixtures
        run: bash scripts/rehearse-267.sh
      - name: Upload public receipts only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr267-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr267-public/
