name: Test pinned upgrade guide
on:
  push:
    branches: [rehearsal/upgrade-v0-2]
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [happy-rollback, recovery]
    env:
      GUIDE_COMMIT: becb4a55efdde4ec18e383e9f4cf76962f15d2f3
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y expect >/dev/null
      - name: Test extracted guide commands
        run: bash scripts/test-upgrade-guide.sh
      - name: Upload public receipts only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guide-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/guide-public/
