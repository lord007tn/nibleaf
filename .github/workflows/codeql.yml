name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so new queries/CVE patterns run against unchanged code.
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          output: ${{ runner.temp }}/codeql-results
          # Private repositories need GitHub Code Security to accept SARIF.
          # Keep the scan useful without that paid repository feature; when the
          # repository is public, publish results to the code-scanning UI.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Retain private-repository results
        if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: codeql-javascript-typescript
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
