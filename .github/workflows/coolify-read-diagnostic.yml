name: Read-only Coolify diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Test diagnostic boundaries
        run: node --test scripts/coolify-read-diagnostic.test.mjs
      - name: Read allowlisted provider summaries
        env:
          COOLIFY_NIBLEAF_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_NIBLEAF_DEPLOY_WEBHOOK }}
          COOLIFY_NIBLEAF_API_TOKEN: ${{ secrets.COOLIFY_NIBLEAF_API_TOKEN }}
          COOLIFY_CF_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_ID }}
          COOLIFY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_SECRET }}
          NIBLEAF_COOLIFY_EXPECTED_SERVER_UUID: ${{ secrets.NIBLEAF_COOLIFY_EXPECTED_SERVER_UUID }}
          NIBLEAF_COOLIFY_EXPECTED_SERVER_ID: ${{ secrets.NIBLEAF_COOLIFY_EXPECTED_SERVER_ID }}
        run: node scripts/coolify-read-diagnostic.mjs
