name: GitBook full workspace verification
on:
  push:
    branches: [rehearsal/gitbook-importer]
permissions:
  contents: read
jobs:
  full-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 0e08e368a74168991d6065e5fd440e8b1eaff0cc
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: git rev-parse HEAD
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec biome format .
      - run: pnpm check:dead-code
      - run: pnpm test
