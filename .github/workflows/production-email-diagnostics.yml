name: Production email diagnostics

on:
  workflow_dispatch:
    inputs:
      repair_provider:
        description: Configure Coolify from the temporary NIBLEAF_POSTMARK_API_KEY repository secret when no provider is configured
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  email:
    name: Inspect production email evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test diagnostic boundaries without credentials
        run: node --test scripts/production-email-diagnostic.test.mjs
      - name: Inspect Coolify worker and email provider
        env:
          COOLIFY_NIBLEAF_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_NIBLEAF_DEPLOY_WEBHOOK }}
          COOLIFY_NIBLEAF_API_TOKEN: ${{ secrets.COOLIFY_NIBLEAF_API_TOKEN }}
          COOLIFY_CF_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_ID }}
          COOLIFY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_SECRET }}
          NIBLEAF_POSTMARK_API_KEY: ${{ secrets.NIBLEAF_POSTMARK_API_KEY }}
          REPAIR_PROVIDER: ${{ inputs.repair_provider }}
        run: node scripts/production-email-diagnostic.mjs
