name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nibleaf
          POSTGRES_PASSWORD: nibleaf
          POSTGRES_USER: nibleaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nibleaf -d nibleaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_DB: nibleaf_analytics
          CLICKHOUSE_PASSWORD: nibleaf
          CLICKHOUSE_USER: nibleaf
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Exercise Prisma migrations and runtime database access
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
        run: |
          pnpm --filter @nibleaf/database exec prisma migrate deploy
          pnpm --filter @nibleaf/database exec prisma migrate status
          pnpm --filter @nibleaf/database smoke
          # Preserve migration ownership: add-ons -> integrations (ApiKey.expiresAt) -> MCP.
          pnpm --filter @nibleaf/database smoke:addons-migration
          pnpm --filter @nibleaf/database smoke:integrations-migration
          pnpm --filter @nibleaf/database smoke:mcp-migration

      - name: Verify concurrent manual-publish receipts
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ACTIVATION_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/worker exec vitest run src/lib/publish-activation.postgres.test.ts

      - name: Exercise ClickHouse analytics migrations
        env:
          ANALYTICS_HASH_SALT: ci-analytics-hash-salt
          ANALYTICS_MODE: dual_write
          CLICKHOUSE_DATABASE: nibleaf_analytics
          CLICKHOUSE_READER_PASSWORD: nibleaf
          CLICKHOUSE_READER_USERNAME: nibleaf
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_WRITER_PASSWORD: nibleaf
          CLICKHOUSE_WRITER_USERNAME: nibleaf
          CLICKHOUSE_INTEGRATION: "1"
        run: |
          pnpm --filter @nibleaf/clickhouse migrate
          pnpm --filter @nibleaf/clickhouse test

      - name: Check documentation
        run: pnpm docs:check

      - name: Check self-host release integrity
        run: |
          pnpm self-host:check
          artifact_dir="$(mktemp -d)"
          node scripts/self-host-release.mjs --output "$artifact_dir"
          (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
          printf '\n# CI tamper proof\n' >> "$artifact_dir/docker-compose.yml"
          if (cd "$artifact_dir" && sha256sum --check SHA256SUMS); then
            echo "::error::Tampered self-host assets passed checksum verification"
            exit 1
          fi

      - name: Check deployment release contract
        run: pnpm release:check

      - name: Check for unused source files
        run: pnpm check:dead-code

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build production app
        env:
          # The integrated app's route graph exceeds V8's default ~4 GiB heap
          # while Rollup renders production chunks on GitHub-hosted runners.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build:app

      - name: Smoke production app runtime
        shell: bash
        env:
          APP_URL: https://nibleaf.com
        run: |
          pnpm --filter @nibleaf/app start > /tmp/nibleaf-app-runtime.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl --connect-timeout 2 --max-time 10 --fail --silent --show-error --header "Host: nibleaf.com" http://127.0.0.1:3000/blog/nibleaf-august-2026-source-release > /tmp/nibleaf-release-en.html; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/nibleaf-app-runtime.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nibleaf-app-runtime.log
            exit 1
          fi
          curl --connect-timeout 2 --max-time 10 --fail --silent --show-error --header "Host: nibleaf.com" http://127.0.0.1:3000/blog/nibleaf-august-2026-source-release-ar > /tmp/nibleaf-release-ar.html
          grep --fixed-strings --quiet "Nibleaf’s August 2026 source release" /tmp/nibleaf-release-en.html
          grep --fixed-strings --quiet "إصدار مصدر Nibleaf في أغسطس 2026" /tmp/nibleaf-release-ar.html

      - name: Build production admin
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @nibleaf/admin build

      - name: Smoke production admin runtime
        shell: bash
        env:
          BETTER_AUTH_SECRET: ci-admin-runtime-smoke-only-0123456789abcdef
          PORT: "4315"
        run: |
          pnpm --filter @nibleaf/admin start > /tmp/nibleaf-admin-runtime.log 2>&1 &
          admin_pid=$!
          trap 'kill "$admin_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 10 --fail --silent --show-error http://127.0.0.1:4315/sign-in > /tmp/nibleaf-admin-sign-in.html; then
              ready=1
              break
            fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then
              cat /tmp/nibleaf-admin-runtime.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nibleaf-admin-runtime.log
            exit 1
          fi
          grep --fixed-strings --quiet "<title>Nibleaf Admin</title>" /tmp/nibleaf-admin-sign-in.html
          if grep --fixed-strings --quiet "__exportAll is not a function" /tmp/nibleaf-admin-runtime.log; then
            cat /tmp/nibleaf-admin-runtime.log
            exit 1
          fi

      - name: Enforce public JavaScript budget
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @nibleaf/app bundle:check 2>&1 | tee apps/app/public-bundle-report.txt

      - name: Upload public bundle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-bundle-report-${{ github.run_id }}
          path: apps/app/public-bundle-report.txt
          if-no-files-found: ignore
          retention-days: 90

      # Dependency vulnerabilities are scanned by the dedicated OSV workflow.
