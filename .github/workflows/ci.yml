name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nibleaf
          POSTGRES_PASSWORD: nibleaf
          POSTGRES_USER: nibleaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nibleaf -d nibleaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_DB: nibleaf_analytics
          CLICKHOUSE_PASSWORD: nibleaf
          CLICKHOUSE_USER: nibleaf
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Test installer safety boundaries
        run: node --test scripts/installer.test.mjs

      - name: Test release notes
        run: node --test scripts/release-notes.test.mjs

      - name: Preview release notes on Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A temporary checkout copy supplies sample prose until the release PR
          # fills Highlights. Never treat this CI fixture as reviewed release copy.
          preview_dir=$(mktemp -d)
          trap 'rm -rf "$preview_dir"' EXIT
          git clone --shared --no-checkout . "$preview_dir"
          git -C "$preview_dir" checkout --detach "$GITHUB_SHA"
          git -C "$preview_dir" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          cd "$preview_dir"
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; const path="CHANGELOG.md"; const text=readFileSync(path,"utf8"); writeFileSync(path, "## Unreleased\n\n### Highlights\n\nPreview release notes from the checked-out source.\n\n" + text.replace(/^## Unreleased$/m,"## Source changes"));'
          # Preview from the latest stable release tag, like a real release does. A
          # fixed old tag made changelogen's git log outgrow execSync's 1 MiB buffer.
          from=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' HEAD)
          pnpm release:notes:dry -- --from "$from" --to HEAD --version v0.2.1 --output "$RUNNER_TEMP/release-notes-preview.md"

      - name: Test production email diagnostic boundaries
        run: node --test scripts/production-email-diagnostic.test.mjs

      - name: Test immutable image verification
        run: node --test scripts/verify-published-image.test.mjs scripts/reject-existing-immutable-tags.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rolling deploys run the previous release against the new schema, so new
      # migrations must be expand-only (operations/runbook-rolling-deploys.md §4).
      - name: Check migrations are expand-only and the image role selector
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/migration-safety.test.mjs scripts/entrypoint-command.test.mjs
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            node scripts/migration-safety.mjs --base "${BASE_SHA}"
          fi

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Compile interface messages
        # Server code imports the generated @nibleaf/i18n/messages modules, and the
        # PostgreSQL suites below run before typecheck would generate them.
        run: pnpm --filter @nibleaf/i18n run setup

      - name: Exercise Prisma migrations and runtime database access
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          TENANT_FENCE_INTEGRATION: "1"
        run: |
          pnpm --filter @nibleaf/database exec prisma migrate deploy
          pnpm --filter @nibleaf/database exec prisma migrate status
          pnpm --filter @nibleaf/database smoke
          # Preserve migration ownership: add-ons -> integrations (ApiKey.expiresAt) -> MCP.
          pnpm --filter @nibleaf/database smoke:addons-migration
          pnpm --filter @nibleaf/database smoke:integrations-migration
          pnpm --filter @nibleaf/database smoke:mcp-migration
          pnpm --filter @nibleaf/database exec vitest run src/tenant-fence.postgres.test.ts

      - name: Verify concurrent manual-publish receipts
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ACTIVATION_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/worker exec vitest run src/lib/publish-activation.postgres.test.ts

      - name: Verify Better Auth on PostgreSQL
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          AUTH_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/auth exec vitest run src/better-auth.postgres.test.ts

      - name: Verify organization grants and expand-only backfill
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ORG_ACCESS_INTEGRATION: "1"
        # The org guard test loads the server env, which imports built workspace packages.
        run: |
          pnpm exec turbo run build --filter="@nibleaf/server^..."
          pnpm --filter @nibleaf/server exec vitest run src/lib/access.postgres.test.ts

      - name: Verify concurrent custom-domain transitions
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          DOMAIN_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/domains.postgres.test.ts

      - name: Verify publishing retention aggregates
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ACTIVATION_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/platform-events.postgres.test.ts

      - name: Verify Promote into main refuses when main changed
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          BRANCH_PROMOTE_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/branches.postgres.test.ts

      - name: Verify the Viewer role cannot change a site
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          VIEWER_ROLE_INTEGRATION: "1"
        # The actions load the server env, which imports built workspace packages.
        run: |
          pnpm exec turbo run build --filter="@nibleaf/server^..."
          pnpm --filter @nibleaf/server exec vitest run src/actions/viewer-role.postgres.test.ts

      - name: Verify organization merge and offline restore
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ORG_MERGE_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/scripts/org-merge.postgres.test.ts src/scripts/org-merge-credentials.postgres.test.ts src/scripts/legacy-writer.postgres.test.ts --maxWorkers=1

      - name: Verify the organization shell and organization deletion
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ORG_SHELL_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/organization-shell.postgres.test.ts src/actions/organization-deletion.postgres.test.ts --maxWorkers=1

      - name: Verify immutable website data partitions
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          DATA_PARTITION_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/data-partition.postgres.test.ts

      - name: Verify site slug races and starter rollback
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          CREATE_SITE_POSTGRES: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/projects.postgres.test.ts --maxWorkers=1

      - name: Verify transactional organization admissions
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ADMISSION_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/admissions.postgres.test.ts --no-file-parallelism

      - name: Verify a rollback never grants more than the new model
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ROLLBACK_SAFETY_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/rollback-safety.postgres.test.ts --maxWorkers=1

      - name: Verify organization people management (invitations, resend, members without websites)
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ORG_PEOPLE_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/organization-people.postgres.test.ts --maxWorkers=1

      - name: Verify join links (atomic max uses, one answer for bad links)
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          JOIN_LINKS_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/join-links.postgres.test.ts

      - name: Verify preserving content imports on PostgreSQL
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          IMPORT_REHEARSAL: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/importers/import-safety.postgres.test.ts

      - name: Verify the People page only shows sites you administer
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          PEOPLE_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/people.postgres.test.ts

      - name: Verify deleting an asset keeps files that saved content uses
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ASSET_DELETE_INTEGRATION: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/asset-delete.postgres.test.ts

      - name: Verify private sites hide every published surface from visitors without access
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          PRIVATE_SITE_INTEGRATION: "1"
          READER_ACCESS_POSTGRES: "1"
        run: |
          pnpm --filter @nibleaf/server exec vitest run src/modules/public/private-site-access.postgres.test.ts
          pnpm --filter @nibleaf/server exec vitest run src/actions/reader-access.postgres.test.ts
          pnpm --filter @nibleaf/server exec vitest run src/actions/site-sign-in.postgres.test.ts
          pnpm --filter @nibleaf/server exec vitest run src/actions/reader-access-requests.postgres.test.ts

      - name: Exercise ClickHouse analytics migrations
        env:
          ANALYTICS_HASH_SALT: ci-analytics-hash-salt
          ANALYTICS_MODE: dual_write
          CLICKHOUSE_DATABASE: nibleaf_analytics
          CLICKHOUSE_READER_PASSWORD: nibleaf
          CLICKHOUSE_READER_USERNAME: nibleaf
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_WRITER_PASSWORD: nibleaf
          CLICKHOUSE_WRITER_USERNAME: nibleaf
          CLICKHOUSE_INTEGRATION: "1"
          # The migration runner serializes workers and the CLI with a PostgreSQL advisory lock.
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
        run: |
          pnpm --filter @nibleaf/clickhouse migrate
          pnpm --filter @nibleaf/clickhouse test

      - name: Verify relational analytics and admin discovery on PostgreSQL
        env:
          POSTGRES_URL: postgresql://nibleaf:nibleaf@127.0.0.1:5432/nibleaf
          ANALYTICS_POSTGRES: "1"
          ADMIN_POSTGRES: "1"
          REVIEWED_PUBLISH_POSTGRES: "1"
          ANALYTICS_MODE: shadow_read
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_DATABASE: nibleaf_analytics
          CLICKHOUSE_READER_USERNAME: nibleaf
          CLICKHOUSE_READER_PASSWORD: nibleaf
        run: pnpm --filter @nibleaf/server exec vitest run src/lib/relational-analytics.postgres.test.ts src/actions/admin.postgres.test.ts src/actions/deployments.reviewed.postgres.test.ts

      - name: Check documentation
        run: pnpm docs:check

      - name: Check self-host release integrity
        run: |
          pnpm self-host:check
          artifact_dir="$(mktemp -d)"
          node scripts/self-host-release.mjs --output "$artifact_dir"
          (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
          printf '\n# CI tamper proof\n' >> "$artifact_dir/docker-compose.yml"
          if (cd "$artifact_dir" && sha256sum --check SHA256SUMS); then
            echo "::error::Tampered self-host assets passed checksum verification"
            exit 1
          fi

      - name: Check deployment release contract
        run: pnpm release:check

      - name: Check for unused source files
        run: pnpm check:dead-code

      - name: Dashboard type scale (no new arbitrary font sizes)
        run: pnpm --filter @nibleaf/app run check:type-scale

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Verify indexed multilingual search and chat fixtures
        env:
          QDRANT_INTEGRATION_URL: http://127.0.0.1:6333
        run: pnpm --filter @nibleaf/server exec vitest run src/lib/ai-search/retrieval.integration.test.ts

      - name: Verify importer timings
        env:
          GITBOOK_PERFORMANCE: "1"
        run: pnpm --filter @nibleaf/server exec vitest run src/actions/importers/gitbook-performance.test.ts --reporter=verbose

      - name: Build production app
        env:
          # The integrated app's route graph exceeds V8's default ~4 GiB heap
          # while Rollup renders production chunks on GitHub-hosted runners.
          NODE_OPTIONS: --max-old-space-size=6144
          # Writes apps/app/.bundle-analysis (outside the deployed output) so the
          # public JavaScript budget step can check module boundaries.
          BUNDLE_ANALYZE: "true"
        run: pnpm build:app

      - name: Smoke production app runtime
        shell: bash
        env:
          APP_URL: https://nibleaf.com
        run: |
          pnpm --filter @nibleaf/app start > /tmp/nibleaf-app-runtime.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if curl --connect-timeout 2 --max-time 10 --fail --silent --show-error --dump-header /tmp/nibleaf-release-en.headers --header "Host: nibleaf.com" http://127.0.0.1:3000/blog/nibleaf-august-2026-source-release > /tmp/nibleaf-release-en.html; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/nibleaf-app-runtime.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nibleaf-app-runtime.log
            exit 1
          fi
          curl --connect-timeout 2 --max-time 10 --fail --silent --show-error --header "Host: nibleaf.com" http://127.0.0.1:3000/blog/nibleaf-august-2026-source-release-ar > /tmp/nibleaf-release-ar.html
          grep --fixed-strings --quiet "Nibleaf’s August 2026 source release" /tmp/nibleaf-release-en.html
          grep --fixed-strings --quiet "إصدار مصدر Nibleaf في أغسطس 2026" /tmp/nibleaf-release-ar.html
          node apps/app/scripts/check-marketing-csp.mjs http://127.0.0.1:3000
          test "$(curl --connect-timeout 2 --max-time 10 --silent --output /dev/null --write-out '%{http_code}' --header 'Host: nibleaf.com' 'http://127.0.0.1:3000/%E0%A4%A')" = 400

      - name: Build production admin
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @nibleaf/admin build

      - name: Smoke production admin runtime
        shell: bash
        env:
          BETTER_AUTH_SECRET: ci-admin-runtime-smoke-only-0123456789abcdef
          PORT: "4315"
        run: |
          pnpm --filter @nibleaf/admin start > /tmp/nibleaf-admin-runtime.log 2>&1 &
          admin_pid=$!
          trap 'kill "$admin_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 10 --fail --silent --show-error --dump-header /tmp/nibleaf-admin-sign-in.headers http://127.0.0.1:4315/sign-in > /tmp/nibleaf-admin-sign-in.html; then
              ready=1
              break
            fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then
              cat /tmp/nibleaf-admin-runtime.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/nibleaf-admin-runtime.log
            exit 1
          fi
          grep --fixed-strings --quiet "<title>Nibleaf Admin</title>" /tmp/nibleaf-admin-sign-in.html
          node apps/app/scripts/check-ssr-nonce.mjs /tmp/nibleaf-admin-sign-in.html /tmp/nibleaf-admin-sign-in.headers
          test "$(curl --connect-timeout 2 --max-time 10 --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:4315/%E0%A4%A')" = 400
          if grep --fixed-strings --quiet "__exportAll is not a function" /tmp/nibleaf-admin-runtime.log; then
            cat /tmp/nibleaf-admin-runtime.log
            exit 1
          fi

      - name: Enforce public JavaScript budget
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @nibleaf/app bundle:check 2>&1 | tee apps/app/public-bundle-report.txt

      - name: Upload public bundle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-bundle-report-${{ github.run_id }}
          path: apps/app/public-bundle-report.txt
          if-no-files-found: ignore
          retention-days: 90

      # Dependency vulnerabilities are scanned by the dedicated OSV workflow.
