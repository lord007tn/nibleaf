name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build production app
        run: pnpm build:app

      - name: Enforce public JavaScript budget
        run: pnpm --filter @nibleaf/app bundle:check 2>&1 | tee apps/app/public-bundle-report.txt

      - name: Upload public bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-bundle-report-${{ github.run_id }}
          path: apps/app/public-bundle-report.txt
          if-no-files-found: ignore
          retention-days: 90

      # Dependency vulnerabilities are scanned by the dedicated OSV workflow.
