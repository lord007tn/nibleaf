name: Docker

# Production images are GATED ON CI: a push to main builds/publishes only via
# workflow_run, after the "CI" workflow (typecheck, lint, tests) has completed
# successfully for that commit. Release tags (v*) build directly — they are
# cut from an already CI-green main. Pull requests build but never push.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "apps/docs/content/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build self-host image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # For workflow_run events, build only when CI succeeded for a PUSH to main.
    # The workflow_run.event guard matters: CI also runs on pull_request, and a
    # fork PR's head branch can be named anything — including "main".
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6
        with:
          # For workflow_run, build the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Validate semver tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Docker release tags must be semantic versions like v0.1.0"
            exit 1
          fi

      # QEMU emulates arm64 so the published image runs on Graviton/Ampere/
      # Raspberry Pi hosts as well as amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          # PRs and CI-gated main deployments target the amd64 cloud host for
          # fast delivery. Versioned release tags remain multi-arch so stable
          # self-host releases also run on ARM servers and Raspberry Pi.
          platforms: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_run') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VITE_API_URL=http://server:4311
            VITE_APP_URL=https://nibleaf.com
            VITE_SITE_BASE_DOMAIN=nibleaf.com
          cache-from: |
            type=gha,scope=nibleaf-image
          cache-to: |
            type=gha,mode=max,scope=nibleaf-image,ignore-error=true

      # Deploys ONLY after a CI-green main build published above (workflow_run
      # is filtered to successful CI push runs on main by the job-level if).
      - name: Trigger Coolify deployment
        if: github.event_name == 'workflow_run'
        env:
          COOLIFY_NIBLEAF_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_NIBLEAF_DEPLOY_WEBHOOK }}
          COOLIFY_NIBLEAF_API_TOKEN: ${{ secrets.COOLIFY_NIBLEAF_API_TOKEN }}
          COOLIFY_CF_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_ID }}
          COOLIFY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "$COOLIFY_NIBLEAF_DEPLOY_WEBHOOK" || -z "$COOLIFY_NIBLEAF_API_TOKEN" || -z "$COOLIFY_CF_ACCESS_CLIENT_ID" || -z "$COOLIFY_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "::warning::Missing a Coolify deployment or Cloudflare Access secret; image was published but Coolify deployment was not triggered"
            exit 0
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --location \
            --proto-redir '=https' \
            --request POST \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${COOLIFY_NIBLEAF_API_TOKEN}" \
            --header "CF-Access-Client-Id: ${COOLIFY_CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${COOLIFY_CF_ACCESS_CLIENT_SECRET}" \
            "$COOLIFY_NIBLEAF_DEPLOY_WEBHOOK")

          printf '%s\n' "$response"
          if ! printf '%s' "$response" | jq --exit-status . >/dev/null; then
            echo "::error::Coolify deploy webhook did not return JSON"
            exit 1
          fi
