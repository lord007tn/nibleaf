name: Docker

# Docker image builds are intentionally manual-only. Select the branch or tag
# to build when dispatching the workflow, and opt into deployment explicitly.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Trigger the Coolify deployment after publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build self-host image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Validate semver tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Docker release tags must be semantic versions like v0.1.0"
            exit 1
          fi

      # QEMU emulates arm64 so the published image runs on Graviton/Ampere/
      # Raspberry Pi hosts as well as amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VITE_API_URL=http://server:4311
            VITE_APP_URL=https://nibleaf.com
            VITE_SITE_BASE_DOMAIN=nibleaf.com
          cache-from: |
            type=gha,scope=nibleaf-image
          cache-to: |
            type=gha,mode=max,scope=nibleaf-image,ignore-error=true

      - name: Trigger Coolify deployment
        if: inputs.deploy
        env:
          COOLIFY_NIBLEAF_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_NIBLEAF_DEPLOY_WEBHOOK }}
          COOLIFY_NIBLEAF_API_TOKEN: ${{ secrets.COOLIFY_NIBLEAF_API_TOKEN }}
          COOLIFY_CF_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_ID }}
          COOLIFY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "$COOLIFY_NIBLEAF_DEPLOY_WEBHOOK" || -z "$COOLIFY_NIBLEAF_API_TOKEN" || -z "$COOLIFY_CF_ACCESS_CLIENT_ID" || -z "$COOLIFY_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "::warning::Missing a Coolify deployment or Cloudflare Access secret; image was published but Coolify deployment was not triggered"
            exit 0
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --location \
            --proto-redir '=https' \
            --request POST \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${COOLIFY_NIBLEAF_API_TOKEN}" \
            --header "CF-Access-Client-Id: ${COOLIFY_CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${COOLIFY_CF_ACCESS_CLIENT_SECRET}" \
            "$COOLIFY_NIBLEAF_DEPLOY_WEBHOOK")

          printf '%s\n' "$response"
          if ! printf '%s' "$response" | jq --exit-status . >/dev/null; then
            echo "::error::Coolify deploy webhook did not return JSON"
            exit 1
          fi
