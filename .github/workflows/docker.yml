name: Docker

# Docker builds are deliberately manual. Pull requests and pushes must not
# spend runner time building images or publish artifacts implicitly.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: main
        type: string
      image_tag:
        description: Container tag to produce
        required: true
        default: latest
        type: string
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      publish:
        description: Publish the image to GHCR
        required: true
        default: false
        type: boolean
      deploy:
        description: Trigger Coolify after a successful publish
        required: true
        default: false
        type: boolean
      compose_replacement_ack:
        description: Acknowledge that the current Coolify Compose deployment can interrupt traffic
        required: true
        default: false
        type: boolean
      migration_mode:
        description: Compatibility of migrations in this release
        required: true
        default: none
        type: choice
        options:
          - none
          - expand-contract
          - restore-required
      migration_evidence:
        description: Privacy-safe migration inventory/dry-run evidence reference (required to deploy)
        required: false
        type: string
      backup_reference:
        description: Verified pre-deploy backup and restore-test reference (required to deploy)
        required: false
        type: string
      rollback_image_tag:
        description: Currently deployed immutable sha-<40 hex> tag (required to deploy)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Every production dispatch shares one lock even when refs differ. A second
  # release waits; it never cancels a migration or compensation in flight.
  group: ${{ inputs.deploy && 'nibleaf-production-release' || format('{0}-{1}', github.workflow, inputs.ref) }}
  cancel-in-progress: false

jobs:
  source:
    name: Pin the requested source revision
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - id: revision
        run: |
          sha=$(git rev-parse HEAD)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout did not resolve to a full Git revision"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  rollback-floor:
    needs: source
    uses: ./.github/workflows/rollback-floor.yml
    with:
      ref: ${{ needs.source.outputs.sha }}

  image:
    needs: [source, rollback-floor]
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    name: Build self-host image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0

      - name: Resolve immutable source revision
        id: source
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout did not resolve to a full Git revision"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$sha" >> "$GITHUB_OUTPUT"

      - name: Validate dispatch
        env:
          DEPLOY: ${{ inputs.deploy }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          COMPOSE_REPLACEMENT_ACK: ${{ inputs.compose_replacement_ack }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          MIGRATION_EVIDENCE: ${{ inputs.migration_evidence }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $TAG"
            exit 1
          fi

          if [[ "$TAG" == sha-* && "$TAG" != "sha-$SOURCE_SHA" ]]; then
            echo "::error::SHA image tag must match the source revision"
            exit 1
          fi

          if [[ "$DEPLOY" == "true" && "$PUBLISH" != "true" ]]; then
            echo "Coolify deployment requires publishing the image"
            exit 1
          fi

          if [[ "$DEPLOY" == "true" && ( "$REF" != "main" || "$GITHUB_REF" != "refs/heads/main" ) ]]; then
            echo "Coolify deployment is allowed only for a main-branch workflow building main"
            exit 1
          fi

          if [[ "$DEPLOY" == "true" ]]; then
            remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$SOURCE_SHA" != "$remote_main" ]]; then
              echo "::error::Checked-out revision $SOURCE_SHA is no longer current main ($remote_main)"
              exit 1
            fi
            if [[ "$COMPOSE_REPLACEMENT_ACK" != "true" ]]; then
              echo "::error::Coolify Docker Compose does not provide application-level rolling updates; acknowledge the replacement window"
              exit 1
            fi
            if [[ "$MIGRATION_MODE" == "restore-required" ]]; then
              echo "::error::Restore-required migrations cannot use the automatic deployment path"
              exit 1
            fi
            if [[ -z "$MIGRATION_EVIDENCE" || -z "$BACKUP_REFERENCE" ]]; then
              echo "::error::Deployment requires migration inventory/dry-run evidence and a verified backup/restore reference"
              exit 1
            fi
            if [[ ! "$ROLLBACK_IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
              echo "::error::Rollback must name the currently deployed immutable sha-<40 hex> image tag"
              exit 1
            fi
          fi

      # Expand-only gate over every migration this release adds since the
      # deployed revision (operations/runbook-rolling-deploys.md §4). The
      # previous release keeps running, and stays the rollback target, against
      # the new schema. The checker parses SQL with the PostgreSQL parser, so it
      # needs the workspace dependencies.
      - name: Install pnpm for the migration gate
        if: inputs.deploy
        uses: pnpm/action-setup@v6

      - name: Setup Node for the migration gate
        if: inputs.deploy
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Refuse migrations that are not expand-only
        if: inputs.deploy
        env:
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          rollback_sha="${ROLLBACK_IMAGE_TAG#sha-}"
          if ! git cat-file -e "${rollback_sha}^{commit}" 2>/dev/null; then
            echo "::error::Rollback revision $rollback_sha is not in this repository's history"
            exit 1
          fi
          if ! safety=$(node scripts/migration-safety.mjs --base "$rollback_sha" 2>&1); then
            echo "$safety"
            echo "::error::This release contains a migration that is not provably expand-only and has no reasoned contract opt-out"
            exit 1
          fi
          echo "$safety"
          if grep -q '^CONTRACT ' <<<"$safety" && [[ "$MIGRATION_MODE" != "expand-contract" ]]; then
            echo "::error::This release contracts the schema; dispatch with migration_mode=expand-contract after confirming the rollback target no longer uses the removed shape"
            exit 1
          fi

      - name: Require successful source CI for publication or deployment
        if: inputs.publish || inputs.deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/check-source-ci.mjs

      - name: Capture verified marketing star count
        id: marketing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stars=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.stargazers_count')
          if [[ ! "$stars" =~ ^[0-9]+$ ]]; then exit 1; fi
          echo "stars=$stars" >> "$GITHUB_OUTPUT"

      # QEMU emulates arm64 so the published image runs on Graviton/Ampere/
      # Raspberry Pi hosts as well as amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=${{ steps.source.outputs.image_tag }}
          # A run dispatched for an older commit would otherwise label the image
          # with the run's github.sha (main HEAD) instead of the commit it built.
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Install OCI archive publisher
        if: inputs.publish
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo

      - name: Build image archive
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: ${{ inputs.platforms }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/nibleaf-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.source.outputs.sha }}
            MARKETING_GITHUB_STARS=${{ steps.marketing.outputs.stars }}
          pull: true
          # Query current stable OS packages on every manual build without
          # disabling the build/runtime-deps stages or pnpm store caches.
          no-cache-filters: runner
          cache-from: |
            type=gha,scope=nibleaf-image
          cache-to: |
            type=gha,mode=max,scope=nibleaf-image,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Reject existing immutable image tags
        if: inputs.publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reject-existing-immutable-tags.mjs

      - name: Recheck source CI before publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/check-source-ci.mjs

      - name: Publish the checked image archive
        if: inputs.publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG: ${{ inputs.image_tag }}
          OCI_ARCHIVE: ${{ runner.temp }}/nibleaf-image.tar
        run: node scripts/publish-built-image.mjs

      - name: Verify published immutable image
        if: inputs.publish
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/verify-published-image.mjs

      - name: Attest published image provenance
        if: inputs.publish
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Deployment requires an explicit publish + deploy choice and is limited
      # to a workflow dispatched on main that also builds the main ref.
      - name: Recheck source CI before deployment
        if: inputs.publish && inputs.deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/check-source-ci.mjs

      - name: Deploy exact image with Coolify, verify production, and compensate on failure
        if: inputs.publish && inputs.deploy && inputs.ref == 'main' && github.ref == 'refs/heads/main'
        # This dedicated token must have exactly deploy, read, write, and
        # read:sensitive: the controller verifies the current image pin before
        # replacing it, updates that one variable, and triggers deployment.
        env:
          COOLIFY_NIBLEAF_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_NIBLEAF_DEPLOY_WEBHOOK }}
          COOLIFY_NIBLEAF_API_TOKEN: ${{ secrets.COOLIFY_NIBLEAF_API_TOKEN }}
          COOLIFY_CF_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_ID }}
          COOLIFY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_SECRET }}
          NIBLEAF_BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          NIBLEAF_MIGRATION_EVIDENCE: ${{ inputs.migration_evidence }}
          NIBLEAF_MIGRATION_MODE: ${{ inputs.migration_mode }}
          NIBLEAF_ROLLBACK_IMAGE_TAG: ${{ inputs.rollback_image_tag }}
          NIBLEAF_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [[ -z "$COOLIFY_NIBLEAF_DEPLOY_WEBHOOK" || -z "$COOLIFY_NIBLEAF_API_TOKEN" || -z "$COOLIFY_CF_ACCESS_CLIENT_ID" || -z "$COOLIFY_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "::error::Missing a Coolify deployment or Cloudflare Access secret"
            exit 1
          fi
          node scripts/coolify-release.mjs
