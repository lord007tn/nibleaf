name: Docker

# Docker builds are deliberately manual. Pull requests and pushes must not
# spend runner time building images or publish artifacts implicitly.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: main
        type: string
      image_tag:
        description: Container tag to produce
        required: true
        default: manual
        type: string
      platforms:
        description: Target platforms
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      publish:
        description: Publish the image to GHCR
        required: true
        default: false
        type: boolean
      deploy:
        description: Trigger Coolify after a successful publish
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build self-host image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Validate dispatch
        env:
          DEPLOY: ${{ inputs.deploy }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $TAG"
            exit 1
          fi

          if [[ "$DEPLOY" == "true" && "$PUBLISH" != "true" ]]; then
            echo "Coolify deployment requires publishing the image"
            exit 1
          fi

          if [[ "$DEPLOY" == "true" && ( "$REF" != "main" || "$GITHUB_REF" != "refs/heads/main" ) ]]; then
            echo "Coolify deployment is allowed only for a main-branch workflow building main"
            exit 1
          fi

      # QEMU emulates arm64 so the published image runs on Graviton/Ampere/
      # Raspberry Pi hosts as well as amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runner
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VITE_API_URL=http://server:4311
            VITE_APP_URL=https://nibleaf.com
            VITE_SITE_BASE_DOMAIN=nibleaf.com
          cache-from: |
            type=gha,scope=nibleaf-image
          cache-to: |
            type=gha,mode=max,scope=nibleaf-image,ignore-error=true

      # Deployment requires an explicit publish + deploy choice and is limited
      # to a workflow dispatched on main that also builds the main ref.
      - name: Trigger Coolify deployment
        if: inputs.publish && inputs.deploy && inputs.ref == 'main' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_NIBLEAF_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_NIBLEAF_DEPLOY_WEBHOOK }}
          COOLIFY_NIBLEAF_API_TOKEN: ${{ secrets.COOLIFY_NIBLEAF_API_TOKEN }}
          COOLIFY_CF_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_ID }}
          COOLIFY_CF_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "$COOLIFY_NIBLEAF_DEPLOY_WEBHOOK" || -z "$COOLIFY_NIBLEAF_API_TOKEN" || -z "$COOLIFY_CF_ACCESS_CLIENT_ID" || -z "$COOLIFY_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "::warning::Missing a Coolify deployment or Cloudflare Access secret; image was published but Coolify deployment was not triggered"
            exit 0
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --location \
            --proto-redir '=https' \
            --request POST \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${COOLIFY_NIBLEAF_API_TOKEN}" \
            --header "CF-Access-Client-Id: ${COOLIFY_CF_ACCESS_CLIENT_ID}" \
            --header "CF-Access-Client-Secret: ${COOLIFY_CF_ACCESS_CLIENT_SECRET}" \
            "$COOLIFY_NIBLEAF_DEPLOY_WEBHOOK")

          printf '%s\n' "$response"
          if ! printf '%s' "$response" | jq --exit-status . >/dev/null; then
            echo "::error::Coolify deploy webhook did not return JSON"
            exit 1
          fi
