name: Publish Nibleaf CLI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the reviewed CLI version
        required: true
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test and publish @nibleaf/cli
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Require a reviewed main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Select the current reviewed main commit."
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.18.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Pin npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm --filter @nibleaf/cli prepublishOnly

      - name: Publish package
        working-directory: packages/cli
        run: npm publish --access public --provenance
