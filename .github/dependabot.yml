version: 2
updates:
  # pnpm workspace — one root lockfile covers every app/package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # Coordinate Node typings majors with the runtime migration in #51.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch routine bumps into a single PR; majors stay individual so
      # breaking changes get their own review.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
