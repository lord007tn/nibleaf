# Midad — Coolify production stack.
#
# Use this compose file in Coolify when you want the self-hostable docs
# platform only. It intentionally omits the marketing/www app.
#
# Assign Coolify domains to:
#   app   : 4310 -> dashboard + published docs + wildcard docs host
#   maxio : 9000 -> bundled public storage/media domain, unless using R2/S3
#
# Required DNS for free project subdomains:
#   *.${SITE_BASE_DOMAIN} CNAME/AAAA/A -> the Coolify app ingress
#
# Required DNS for custom domains:
#   customers CNAME their docs host to ${CUSTOM_DOMAIN_CNAME_TARGET}
#
# Set MIDAD_HEALTHCHECK_HOST to the dashboard host without a scheme when your
# app uses host-based routing.
#
# When moving an existing Coolify Application to a Service, set
# MIDAD_EXTERNAL_VOLUMES=true and point the MIDAD_*_VOLUME variables at the
# existing Docker volume names before deploying the replacement service.

name: midad-coolify

# Pull-based Coolify stack: it PULLS the prebuilt image published by CI
# (.github/workflows/docker.yml -> ghcr.io/lord007tn/midad:latest) instead of
# building on the Coolify server. Building the whole monorepo in-container needs
# ~5-6GB free RAM and OOMs on smaller/shared servers, so pulling the CI image is
# both faster and more reliable. Override the tag with MIDAD_IMAGE if needed.
# To build from source instead, use docker-compose.yml (which keeps `build:`).
#
# NOTE: the published image bakes CI's generic VITE_* client URLs. The published
# docs site (SSR) and same-origin /api use the RUNTIME APP_URL / SERVICE_URL_APP
# you assign in Coolify, so it is functionally correct; only the dashboard's
# client-side URL previews reflect the build-time defaults.

x-service-env: &service-env
  NODE_ENV: production
  POSTGRES_URL: postgresql://${SERVICE_USER_POSTGRES:?set SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES:?set SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-midad}
  REDIS_HOST: dragonfly
  REDIS_PORT: "6379"
  QUEUE_CLUSTER: "true"
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-maxio}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://maxio:9000}
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-${SERVICE_URL_MAXIO:?assign the storage domain to maxio or set STORAGE_PUBLIC_ENDPOINT for R2/S3}}
  STORAGE_REGION: ${STORAGE_REGION:-auto}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-${SERVICE_USER_STORAGE:?set STORAGE_ACCESS_KEY_ID or SERVICE_USER_STORAGE}}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-${SERVICE_PASSWORD_64_STORAGE:?set STORAGE_SECRET_ACCESS_KEY or SERVICE_PASSWORD_64_STORAGE}}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-midad}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-${SERVICE_URL_MAXIO:?assign the storage domain to maxio or set STORAGE_PUBLIC_URL for R2/S3}/midad}
  STORAGE_CORS_ALLOWED_ORIGINS: ${STORAGE_CORS_ALLOWED_ORIGINS:-${SERVICE_URL_APP:?assign the dashboard domain to the app service in Coolify}}
  STORAGE_AUTO_CORS: ${STORAGE_AUTO_CORS:-true}
  BETTER_AUTH_SECRET: ${SERVICE_HEX_64_MIDAD:?set SERVICE_HEX_64_MIDAD}
  BETTER_AUTH_URL: ${SERVICE_URL_APP:?assign the dashboard domain to the app service in Coolify}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-${SERVICE_URL_APP:?assign the dashboard domain to the app service in Coolify}}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${SERVICE_URL_APP:?assign the dashboard domain to the app service in Coolify}}
  API_PORT: "4311"
  API_URL: http://server:4311
  APP_URL: ${SERVICE_URL_APP:?assign the dashboard domain to the app service in Coolify}
  WWW_URL: ${WWW_URL:-${SERVICE_URL_APP:?assign the dashboard domain to the app service in Coolify}}
  SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:?set SITE_BASE_DOMAIN, for example docs.example.com}
  CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:?set CUSTOM_DOMAIN_CNAME_TARGET, for example cname.docs.example.com}
  WORKER_PORT: "4312"
  EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
  SMTP_URL: ${SMTP_URL:?set SMTP_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MIDAD_RUN_SEED: ${MIDAD_RUN_SEED:-false}
  PLUME_RUN_SEED: ${MIDAD_RUN_SEED:-false}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:?set SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?set SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-midad}
    volumes:
      - midad-coolify-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    command: ["dragonfly", "--cluster_mode=emulated", "--lock_on_hashtags"]
    volumes:
      - midad-coolify-dragonfly:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  maxio:
    image: ghcr.io/coollabsio/maxio:latest
    restart: unless-stopped
    environment:
      MAXIO_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:-${SERVICE_USER_STORAGE:?set STORAGE_ACCESS_KEY_ID or SERVICE_USER_STORAGE}}
      MAXIO_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:-${SERVICE_PASSWORD_64_STORAGE:?set STORAGE_SECRET_ACCESS_KEY or SERVICE_PASSWORD_64_STORAGE}}
      MAXIO_REGION: ${STORAGE_REGION:-auto}
      MAXIO_DEFAULT_BUCKETS: ${STORAGE_BUCKET:-midad}
      MAXIO_PUBLIC_BUCKETS: ${STORAGE_BUCKET:-midad}
      MAXIO_SECURE_COOKIES: ${MAXIO_SECURE_COOKIES:-true}
    expose:
      - "9000"
    volumes:
      - midad-coolify-maxio:/data
    healthcheck:
      test: ["CMD", "maxio", "healthcheck", "--url", "http://127.0.0.1:9000/healthz", "--timeout-ms", "2000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: "${MIDAD_IMAGE:-ghcr.io/lord007tn/midad:latest}"
    command: ["migrate"]
    environment: *service-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: "${MIDAD_IMAGE:-ghcr.io/lord007tn/midad:latest}"
    command: ["server"]
    init: true
    environment: *service-env
    expose:
      - "4311"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4311/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    image: "${MIDAD_IMAGE:-ghcr.io/lord007tn/midad:latest}"
    command: ["worker"]
    init: true
    environment: *service-env
    expose:
      - "4312"
    depends_on:
      dragonfly:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4312/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  app:
    image: "${MIDAD_IMAGE:-ghcr.io/lord007tn/midad:latest}"
    command: ["app"]
    init: true
    environment:
      <<: *service-env
      PORT: "4310"
      VITE_SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:?set SITE_BASE_DOMAIN}
    expose:
      - "4310"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -A midad-healthcheck -H \"Host: ${MIDAD_HEALTHCHECK_HOST:-app.trymidad.com}\" http://127.0.0.1:4310/ >/dev/null && curl -fsS -A midad-healthcheck -H \"Host: ${MIDAD_HEALTHCHECK_HOST:-app.trymidad.com}\" http://127.0.0.1:4310/api/app/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  midad-coolify-pg:
    external: ${MIDAD_EXTERNAL_VOLUMES:-false}
    name: ${MIDAD_PG_VOLUME:-midad-coolify-pg}
  midad-coolify-dragonfly:
    external: ${MIDAD_EXTERNAL_VOLUMES:-false}
    name: ${MIDAD_DRAGONFLY_VOLUME:-midad-coolify-dragonfly}
  midad-coolify-maxio:
    external: ${MIDAD_EXTERNAL_VOLUMES:-false}
    name: ${MIDAD_MAXIO_VOLUME:-midad-coolify-maxio}
