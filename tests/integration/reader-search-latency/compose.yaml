services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: passer
      POSTGRES_DB: reader_search_latency
    ports:
      - '127.0.0.1:55463:5432'
    mem_limit: 512m
    cpus: 1
    volumes:
      - search-latency:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d reader_search_latency']
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  search-latency:
