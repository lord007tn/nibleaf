packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - '@prisma/client'
  - esbuild
  - sharp

overrides:
  # Keep vulnerable transitive tooling out of clean installs. Remove an
  # override once every upstream dependency accepts the fixed version.
  brace-expansion: 5.0.9
  fast-uri: 3.1.6
  ip-address: 10.3.1
  js-yaml: 4.3.1
  linkify-it: 5.0.2
  postcss: 8.5.23
  qs: 6.16.0
  sharp: 0.35.3
  shell-quote: 1.9.0
  undici: 7.29.0
