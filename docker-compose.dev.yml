name: nibleaf-dev

# Local development infrastructure only (Postgres, Dragonfly, maxio). Run the
# apps with `pnpm dev`. For a full self-hosted stack see docker-compose.yml.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nibleaf
      POSTGRES_PASSWORD: nibleaf
      POSTGRES_DB: nibleaf
    ports:
      - '5442:5432'
    volumes:
      - nibleaf-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nibleaf -d nibleaf']
      interval: 5s
      timeout: 5s
      retries: 10

  # Dragonfly — Redis-compatible backend for BullMQ. Nibleaf hash-tags queue names
  # so Dragonfly can keep BullMQ keys grouped.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
    restart: unless-stopped
    command: ['dragonfly', '--cluster_mode=emulated', '--lock_on_hashtags']
    ulimits:
      memlock: -1
    ports:
      - '6381:6379'
    volumes:
      - nibleaf-dragonfly:/data

  # Qdrant v1.19 adds per-tenant IDF corpus filters used by Nibleaf's BM25 lane.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - '6333:6333'
    volumes:
      - nibleaf-qdrant:/qdrant/storage

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: nibleaf_analytics
      CLICKHOUSE_USER: nibleaf
      CLICKHOUSE_PASSWORD: nibleaf
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '8123:8123'
    volumes:
      - nibleaf-clickhouse:/var/lib/clickhouse
      - nibleaf-clickhouse-logs:/var/log/clickhouse-server
      - nibleaf-clickhouse-backups:/var/lib/clickhouse/backups
    configs:
      - source: clickhouse-small-host
        target: /etc/clickhouse-server/config.d/nibleaf.xml
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # maxio — S3-compatible object storage. Auto-creates the `nibleaf` bucket and
  # serves it with anonymous read so doc assets load by their public URL.
  # Console: http://localhost:9300/ui/
  maxio:
    image: docker.io/coollabsio/maxio:0.4.2
    restart: unless-stopped
    environment:
      MAXIO_ACCESS_KEY: nibleafadmin
      MAXIO_SECRET_KEY: nibleafadmin123
      MAXIO_REGION: auto
      MAXIO_DEFAULT_BUCKETS: nibleaf
      MAXIO_PUBLIC_BUCKETS: nibleaf
      MAXIO_ALLOW_INSECURE_DEV: 'true'
    ports:
      - '9300:9000'
    volumes:
      - nibleaf-maxio:/data
    healthcheck:
      test: ['CMD', 'maxio', 'healthcheck', '--url', 'http://127.0.0.1:9000/healthz', '--timeout-ms', '2000']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nibleaf-pg:
  nibleaf-dragonfly:
  nibleaf-qdrant:
  nibleaf-maxio:
  nibleaf-clickhouse:
  nibleaf-clickhouse-logs:
  nibleaf-clickhouse-backups:

configs:
  clickhouse-small-host:
    content: |
      <clickhouse>
        <max_server_memory_usage>1073741824</max_server_memory_usage>
        <mark_cache_size>134217728</mark_cache_size>
        <uncompressed_cache_size>0</uncompressed_cache_size>
        <logger><level>warning</level><size>10M</size><count>3</count></logger>
        <query_log remove="1"/><query_thread_log remove="1"/><trace_log remove="1"/>
        <text_log remove="1"/><metric_log remove="1"/><asynchronous_metric_log remove="1"/>
        <part_log remove="1"/><processors_profile_log remove="1"/>
        <session_log remove="1"/><query_views_log remove="1"/>
        <error_log remove="1"/><crash_log remove="1"/>
        <storage_configuration><disks><backups><type>local</type><path>/var/lib/clickhouse/backups/</path></backups></disks></storage_configuration>
        <backups><allowed_disk>backups</allowed_disk></backups>
      </clickhouse>
