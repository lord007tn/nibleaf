# Optional production overlay for Nibleaf v0.2 hybrid search. Use it only with a
# v0.2.0 or later image; v0.1.2 has no hybrid search path.
x-search-env: &search-env
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-nibleaf_search_active}
  QDRANT_COLLECTION_VERSION: ${QDRANT_COLLECTION_VERSION:-v1}
  QDRANT_VECTOR_SIZE: ${SEARCH_EMBEDDING_DIMENSIONS:-1536}
  SEARCH_RUNTIME: ${SEARCH_RUNTIME:-shadow}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  SEARCH_EMBEDDING_MODEL: ${SEARCH_EMBEDDING_MODEL:-openai/text-embedding-3-small}
  SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-1536}
  SEARCH_ANSWER_ENABLED: ${SEARCH_ANSWER_ENABLED:-false}
  SEARCH_ANSWER_MODEL: ${SEARCH_ANSWER_MODEL:-openai/gpt-5.6-luna}
  SEARCH_ANSWER_DAILY_PER_PROJECT: ${SEARCH_ANSWER_DAILY_PER_PROJECT:-200}
  SEARCH_ANSWER_RATE_LIMIT_PER_MIN: ${SEARCH_ANSWER_RATE_LIMIT_PER_MIN:-10}
  SEARCH_CHAT_MAX_TURNS: ${SEARCH_CHAT_MAX_TURNS:-20}
  SEARCH_CHAT_MAX_CONVERSATION_TOKENS: ${SEARCH_CHAT_MAX_CONVERSATION_TOKENS:-60000}
  SEARCH_CHAT_DAILY_TOKENS_PER_PROJECT: ${SEARCH_CHAT_DAILY_TOKENS_PER_PROJECT:-2000000}
  SEARCH_CHAT_HISTORY_MESSAGES: ${SEARCH_CHAT_HISTORY_MESSAGES:-6}
  SEARCH_CHAT_HISTORY_MAX_TOKENS: ${SEARCH_CHAT_HISTORY_MAX_TOKENS:-1500}
  SEARCH_CHAT_UTILITY_MODEL: ${SEARCH_CHAT_UTILITY_MODEL:-}
  AI_CONVERSATION_ENCRYPTION_KEY: ${AI_CONVERSATION_ENCRYPTION_KEY:-}
  AI_CONVERSATION_RETENTION_DAYS: ${AI_CONVERSATION_RETENTION_DAYS:-90}

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - nibleaf-qdrant:/qdrant/storage

  server:
    environment:
      <<: *search-env
    depends_on:
      qdrant:
        condition: service_started

  worker:
    environment:
      <<: *search-env
    depends_on:
      qdrant:
        condition: service_started

volumes:
  nibleaf-qdrant:
