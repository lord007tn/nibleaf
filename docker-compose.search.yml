# Optional production overlay for Nibleaf v0.2 hybrid search. Keep the signed
# v0.1.2 self-host artifact immutable; enable this overlay only with a v0.2 image.
x-search-env: &search-env
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION_ALIAS: ${QDRANT_COLLECTION_ALIAS:-nibleaf_search_active}
  QDRANT_COLLECTION_VERSION: ${QDRANT_COLLECTION_VERSION:-v1}
  QDRANT_VECTOR_SIZE: ${SEARCH_EMBEDDING_DIMENSIONS:-1536}
  SEARCH_RUNTIME: ${SEARCH_RUNTIME:-shadow}
  SEARCH_EMBEDDING_API_KEY: ${SEARCH_EMBEDDING_API_KEY:-}
  SEARCH_EMBEDDING_BASE_URL: ${SEARCH_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
  SEARCH_EMBEDDING_MODEL: ${SEARCH_EMBEDDING_MODEL:-text-embedding-3-small}
  SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-1536}
  SEARCH_ANSWER_ENABLED: ${SEARCH_ANSWER_ENABLED:-false}
  SEARCH_ANSWER_API_KEY: ${SEARCH_ANSWER_API_KEY:-}
  SEARCH_ANSWER_BASE_URL: ${SEARCH_ANSWER_BASE_URL:-https://openrouter.ai/api/v1}
  SEARCH_ANSWER_MODEL: ${SEARCH_ANSWER_MODEL:-openai/gpt-5.6-luna}
  SEARCH_ANSWER_DAILY_PER_PROJECT: ${SEARCH_ANSWER_DAILY_PER_PROJECT:-200}
  SEARCH_ANSWER_RATE_LIMIT_PER_MIN: ${SEARCH_ANSWER_RATE_LIMIT_PER_MIN:-10}

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - nibleaf-qdrant:/qdrant/storage

  server:
    environment:
      <<: *search-env
    depends_on:
      qdrant:
        condition: service_started

  worker:
    environment:
      <<: *search-env
    depends_on:
      qdrant:
        condition: service_started

volumes:
  nibleaf-qdrant:
