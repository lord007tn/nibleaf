name: nibleaf

# Full self-hosted Nibleaf stack. Quick start:
#   cp .env.example .env   # (optional — sensible defaults below)
#   docker compose up -d --build
# Then open http://localhost:4310.
#
# For production: set strong POSTGRES_PASSWORD / STORAGE_SECRET_KEY /
# BETTER_AUTH_SECRET and put the apps behind a TLS reverse proxy.
# Cache = Dragonfly (Redis-compatible); object storage = maxio (S3-compatible).

x-build: &build
  context: .
  dockerfile: Dockerfile
  target: runner
  args:
    VITE_API_URL: http://server:4311
    VITE_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4310}
    VITE_WWW_URL: ${PUBLIC_APP_URL:-http://localhost:4310}
    VITE_SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:-docs.trynibleaf.com}

x-service-env: &service-env
  NODE_ENV: production
  POSTGRES_URL: postgresql://nibleaf:${POSTGRES_PASSWORD:-nibleaf}@postgres:5432/nibleaf
  REDIS_HOST: dragonfly
  REDIS_PORT: "6379"
  QUEUE_CLUSTER: "true"
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-maxio}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://maxio:9000}
  STORAGE_PUBLIC_ENDPOINT: ${PUBLIC_STORAGE_ENDPOINT:-http://localhost:9300}
  STORAGE_REGION: ${STORAGE_REGION:-auto}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-nibleafadmin}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-nibleafadmin123}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-nibleaf}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
  STORAGE_PUBLIC_URL: ${PUBLIC_STORAGE_URL:-http://localhost:9300/nibleaf}
  STORAGE_CORS_ALLOWED_ORIGINS: ${STORAGE_CORS_ALLOWED_ORIGINS:-${PUBLIC_APP_URL:-http://localhost:4310}}
  STORAGE_AUTO_CORS: ${STORAGE_AUTO_CORS:-true}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production-32chars-minimum}
  BETTER_AUTH_URL: ${PUBLIC_APP_URL:-http://localhost:4310}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
  TRUSTED_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:4310}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:4310}
  API_PORT: "4311"
  API_URL: ${PUBLIC_API_URL:-http://localhost:4311}
  APP_URL: ${PUBLIC_APP_URL:-http://localhost:4310}
  SITE_BASE_DOMAIN: ${SITE_BASE_DOMAIN:-}
  CUSTOM_DOMAIN_CNAME_TARGET: ${CUSTOM_DOMAIN_CNAME_TARGET:-cname.docs.trynibleaf.com}
  WORKER_PORT: "4312"
  # Email delivery (optional). Postmark is preferred when POSTMARK_API_KEY is set;
  # SMTP_URL remains a fallback. Without either, the worker logs mail.
  EMAIL_FROM: ${EMAIL_FROM:-nibleaf@localhost}
  POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
  POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-}
  SMTP_URL: ${SMTP_URL:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nibleaf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nibleaf}
      POSTGRES_DB: nibleaf
    volumes:
      - nibleaf-pg:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibleaf -d nibleaf"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Dragonfly — Redis-compatible queue backend for BullMQ. Queue names are
  # hash-tagged by default, so Dragonfly can keep BullMQ keys grouped.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    command: ["dragonfly", "--cluster_mode=emulated", "--lock_on_hashtags"]
    ulimits:
      memlock: -1
    volumes:
      - nibleaf-dragonfly:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # maxio — S3-compatible object storage. Auto-creates the bucket
  # (MAXIO_DEFAULT_BUCKETS) and serves it with anonymous read (MAXIO_PUBLIC_BUCKETS)
  # so published doc assets load by their public URL. Console at /ui/.
  maxio:
    image: ghcr.io/coollabsio/maxio:latest
    restart: unless-stopped
    environment:
      MAXIO_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-nibleafadmin}
      MAXIO_SECRET_KEY: ${STORAGE_SECRET_KEY:-nibleafadmin123}
      MAXIO_REGION: auto
      MAXIO_DEFAULT_BUCKETS: nibleaf
      MAXIO_PUBLIC_BUCKETS: nibleaf
      MAXIO_ALLOW_INSECURE_DEV: "true"
    volumes:
      - nibleaf-maxio:/data
    ports:
      - "${MAXIO_PORT:-9300}:9000"
    healthcheck:
      test: ["CMD", "maxio", "healthcheck", "--url", "http://127.0.0.1:9000/healthz", "--timeout-ms", "2000"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: nibleaf:latest
    command: ["migrate"]
    environment: *service-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build: *build
    image: nibleaf:latest
    command: ["server"]
    init: true
    environment: *service-env
    ports:
      - "${API_PORT:-4311}:4311"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4311/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: nibleaf:latest
    command: ["worker"]
    init: true
    environment: *service-env
    ports:
      - "${WORKER_PORT:-4312}:4312"
    depends_on:
      dragonfly:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4312/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  app:
    image: nibleaf:latest
    command: ["app"]
    init: true
    environment:
      <<: *service-env
      PORT: "4310"
    ports:
      - "${APP_PORT:-4310}:4310"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4310/sign-in"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  nibleaf-pg:
  nibleaf-dragonfly:
  nibleaf-maxio:
